<!-- Privacy-conscious anonymous website analytics (Supabase) -->
<script>
(function () {
  const SUPABASE_URL = "https://uleyuztknttexfeejsiv.supabase.co";
  const SUPABASE_KEY = "sb_publishable_FTz3p__F-mc5r9YRbB_AQA_ebRdWmWi";

  let referrerDomain = null;
  try {
    if (document.referrer) {
      const ref = new URL(document.referrer);
      if (ref.hostname && ref.hostname !== window.location.hostname) {
        referrerDomain = ref.hostname.slice(0, 200);
      }
    }
  } catch (_) {}

  const payload = {
    page_path: (window.location.pathname || "/").slice(0, 300),
    referrer_domain: referrerDomain
  };

  fetch(SUPABASE_URL + "/rest/v1/website_usage_events", {
    method: "POST",
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json",
      "Prefer": "return=minimal"
    },
    body: JSON.stringify(payload),
    keepalive: true
  }).catch(function () {
    // Analytics must never interfere with the website.
  });
})();
</script>
